<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SSO Bootstrap</title>
</head>
<body>
  <script>
  (async function() {
    try {
      console.log('[SSO iframe] ITSM 세션 확인 시작');

      // ITSM login.do 요청
      const response = await fetch('https://itsm.services.sap/login.do', {
        credentials: 'include',
        redirect: 'follow'
      });

      const html = await response.text();
      const match = html.match(/g_ck\s*=\s*['"]([^'"]+)['"]/);

      if (match) {
        console.log('[SSO iframe] g_ck 획득 성공');
        // parent에 성공 메시지 전송
        window.parent.postMessage({
          type: 'SSO_SUCCESS',
          gck: match[1]
        }, '*');
      } else {
        // 로그인 페이지인 경우 → SSO 리다이렉트 필요
        const isLoginPage = html.includes('login') && html.includes('password');
        if (isLoginPage) {
          console.log('[SSO iframe] 로그인 필요 → ITSM 페이지로 리다이렉트');
          // iframe을 ITSM 메인 페이지로 변경 (SSO 자동 실행)
          window.location.href = 'https://itsm.services.sap/';

          // SSO 완료 후 다시 체크 (30초 타임아웃)
          setTimeout(async () => {
            try {
              const retry = await fetch('https://itsm.services.sap/login.do', {
                credentials: 'include'
              });
              const retryHtml = await retry.text();
              const retryMatch = retryHtml.match(/g_ck\s*=\s*['"]([^'"]+)['"]/);

              if (retryMatch) {
                console.log('[SSO iframe] SSO 완료 후 g_ck 획득');
                window.parent.postMessage({
                  type: 'SSO_SUCCESS',
                  gck: retryMatch[1]
                }, '*');
              } else {
                console.error('[SSO iframe] SSO 실패');
                window.parent.postMessage({
                  type: 'SSO_FAILED',
                  error: 'SSO 타임아웃'
                }, '*');
              }
            } catch (e) {
              console.error('[SSO iframe] 재시도 오류:', e);
              window.parent.postMessage({
                type: 'SSO_FAILED',
                error: e.message
              }, '*');
            }
          }, 5000);
        } else {
          console.error('[SSO iframe] g_ck 추출 실패');
          window.parent.postMessage({
            type: 'SSO_FAILED',
            error: 'g_ck 추출 실패'
          }, '*');
        }
      }
    } catch (e) {
      console.error('[SSO iframe] 오류:', e);
      window.parent.postMessage({
        type: 'SSO_FAILED',
        error: e.message
      }, '*');
    }
  })();
  </script>
</body>
</html>
